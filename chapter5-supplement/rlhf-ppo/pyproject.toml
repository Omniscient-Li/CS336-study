[project]
name = "rlhf-ppo"
version = "0.2.0"
description = "IMDB sentiment PPO with the modern TRL 1.12 API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.7.1",
    "transformers==4.57.6",
    "datasets==4.7.0",
    "trl==1.12.0",
    "accelerate==1.12.0",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16,<1"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
